<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scraped News Articles - Forum Bot</title>
    
    <!-- Cache Busting Meta Tags -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="cache-bust" content="{{ cache_bust_id if cache_bust_id else '1' }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .article-card {
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
            height: 100%;
        }
        .article-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .source-badge {
            font-size: 0.75rem;
            font-weight: bold;
        }
        .article-preview {
            color: #6c757d;
            font-size: 0.9rem;
            line-height: 1.4;
        }
        .side-drawer {
            position: fixed;
            top: 0;
            right: -100%;
            width: 60%;
            height: 100vh;
            background: white;
            box-shadow: -2px 0 10px rgba(0,0,0,0.1);
            transition: right 0.3s ease;
            z-index: 1050;
            overflow-y: auto;
        }
        .side-drawer.open {
            right: 0;
        }
        .drawer-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: rgba(0,0,0,0.5);
            z-index: 1040;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        .drawer-overlay.show {
            opacity: 1;
            visibility: visible;
        }
        .article-stats {
            font-size: 0.8rem;
            color: #6c757d;
        }
        .article-content {
            line-height: 1.6;
            font-size: 1rem;
        }
        .loading-spinner {
            text-align: center;
            padding: 2rem;
        }
        .no-articles {
            text-align: center;
            padding: 3rem;
            color: #6c757d;
        }
        .topic-selector {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1rem;
        }
        @media (max-width: 768px) {
            .side-drawer {
                width: 95%;
            }
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <!-- Navigation Header -->
        <div class="row">
            <div class="col-12">
                <nav class="navbar navbar-expand-lg navbar-light bg-light mb-4">
                    <div class="container-fluid">
                        <a class="navbar-brand" href="/">
                            <i class="fas fa-robot me-2"></i>Forum Bot Engine
                        </a>
                        <div class="navbar-nav ms-auto">
                            <a class="nav-link" href="/unified">
                                <i class="fas fa-tachometer-alt me-1"></i>Unified Dashboard
                            </a>
                            <a class="nav-link" href="/workflow">
                                <i class="fas fa-project-diagram me-1"></i>Workflow
                            </a>
                            <a class="nav-link" href="/">
                                <i class="fas fa-search me-1"></i>Search News
                            </a>
                            <a class="nav-link active" href="/scraped-news">
                                <i class="fas fa-newspaper me-1"></i>Scraped Articles
                            </a>
                            <a class="nav-link" href="/content">
                                <i class="fas fa-comments me-1"></i>Generated Posts
                            </a>
                        </div>
                    </div>
                </nav>
            </div>
        </div>

        <!-- Main Content -->
        <div class="row">
            <div class="col-12">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h2><i class="fas fa-newspaper me-2"></i>Scraped News Articles</h2>
                        <p class="text-muted mb-0">View and process articles extracted from news sources</p>
                    </div>
                    <div class="d-flex gap-2">
                        <button class="btn btn-outline-primary" onclick="refreshArticles()">
                            <i class="fas fa-sync-alt me-1"></i>Refresh
                        </button>
                        <div class="btn-group">
                            <button class="btn btn-outline-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown">
                                <i class="fas fa-filter me-1"></i>Filter
                            </button>
                            <ul class="dropdown-menu">
                                <li><a class="dropdown-item" href="#" onclick="filterBySource('all')">All Sources</a></li>
                                <li><a class="dropdown-item" href="#" onclick="filterBySource('moneycontrol.com')">MoneyControl</a></li>
                                <li><a class="dropdown-item" href="#" onclick="filterBySource('economictimes.indiatimes.com')">Economic Times</a></li>
                                <li><a class="dropdown-item" href="#" onclick="filterBySource('livemint.com')">LiveMint</a></li>
                            </ul>
                        </div>
                    </div>
                </div>

                <!-- Articles Grid -->
                <div id="articles-container">
                    <div class="loading-spinner">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Loading articles...</span>
                        </div>
                        <p class="mt-2">Loading scraped articles...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Side Drawer for Article Details -->
    <div class="drawer-overlay" onclick="closeDrawer()"></div>
    <div class="side-drawer">
        <div class="p-4">
            <div class="d-flex justify-content-between align-items-start mb-3">
                <h5><i class="fas fa-newspaper me-2"></i>Article Details</h5>
                <button class="btn btn-outline-secondary btn-sm" onclick="closeDrawer()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div id="drawer-content">
                <!-- Article details will be loaded here -->
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        let articlesData = [];
        let filteredData = [];

        // Load articles on page load
        document.addEventListener('DOMContentLoaded', function() {
            loadArticles();
        });

        async function loadArticles() {
            try {
                const response = await fetch('/api/scraped-articles');
                articlesData = await response.json();
                filteredData = [...articlesData];
                renderArticles();
            } catch (error) {
                console.error('Error loading articles:', error);
                document.getElementById('articles-container').innerHTML = `
                    <div class="alert alert-danger" role="alert">
                        <i class="fas fa-exclamation-triangle me-2"></i>
                        Error loading articles. Please try again.
                    </div>
                `;
            }
        }

        function renderArticles() {
            const container = document.getElementById('articles-container');
            
            if (filteredData.length === 0) {
                container.innerHTML = `
                    <div class="no-articles">
                        <i class="fas fa-newspaper fa-3x mb-3 text-muted"></i>
                        <h4>No scraped articles found</h4>
                        <p>Articles will appear here after they are scraped from news sources.</p>
                        <a href="/" class="btn btn-primary">
                            <i class="fas fa-search me-2"></i>Search for News
                        </a>
                    </div>
                `;
                return;
            }

            const articlesHtml = `
                <div class="row">
                    ${filteredData.map((article, index) => `
                        <div class="col-lg-4 col-md-6 mb-4">
                            <div class="card article-card h-100" onclick="openArticleDrawer(${index})">
                                <div class="card-body">
                                    <div class="d-flex justify-content-between align-items-start mb-2">
                                        <span class="badge bg-info source-badge">${article.source_domain}</span>
                                        <small class="text-muted">${getTimeAgo(article.extracted_at)}</small>
                                    </div>
                                    
                                    <h6 class="card-title">${article.title}</h6>
                                    
                                    <p class="article-preview">${article.preview}</p>
                                    
                                    <div class="article-stats d-flex justify-content-between">
                                        <span><i class="fas fa-align-left me-1"></i>${article.word_count} words</span>
                                        <span><i class="fas fa-external-link-alt me-1"></i>View Full</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
            
            container.innerHTML = articlesHtml;
        }

        function openArticleDrawer(index) {
            const article = filteredData[index];
            const overlay = document.querySelector('.drawer-overlay');
            const drawer = document.querySelector('.side-drawer');
            
            document.getElementById('drawer-content').innerHTML = `
                <div class="mb-3">
                    <span class="badge bg-info me-2">${article.source_domain}</span>
                    <small class="text-muted">${getTimeAgo(article.extracted_at)}</small>
                </div>
                
                <h4 class="mb-3">${article.title}</h4>
                
                <div class="article-stats mb-3 p-2 bg-light rounded">
                    <div class="row text-center">
                        <div class="col-4">
                            <small class="text-muted d-block">Words</small>
                            <strong>${article.word_count}</strong>
                        </div>
                        <div class="col-8">
                            <small class="text-muted d-block">Source URL</small>
                            <a href="${article.url}" target="_blank" class="small text-truncate d-block">
                                ${article.url}
                            </a>
                        </div>
                    </div>
                </div>

                <div class="topic-selector">
                    <h6><i class="fas fa-tags me-2"></i>Process this article</h6>
                    <p class="small text-muted">Select a topic to generate a forum post from this article:</p>
                    <div class="d-flex gap-2 flex-wrap">
                        <button class="btn btn-outline-primary btn-sm" onclick="processArticle('${article.url}', 'NIFTY')">NIFTY</button>
                        <button class="btn btn-outline-primary btn-sm" onclick="processArticle('${article.url}', 'BANKNIFTY')">BANKNIFTY</button>
                        <button class="btn btn-outline-primary btn-sm" onclick="processArticle('${article.url}', 'STOCKS')">STOCKS</button>
                        <button class="btn btn-outline-primary btn-sm" onclick="processArticle('${article.url}', 'IPO')">IPO</button>
                        <button class="btn btn-outline-primary btn-sm" onclick="processArticle('${article.url}', 'GENERAL')">GENERAL</button>
                    </div>
                </div>
                
                <div class="mt-4">
                    <h6><i class="fas fa-file-text me-2"></i>Article Content</h6>
                    <div class="article-content p-3 bg-light rounded" style="max-height: 400px; overflow-y: auto;">
                        ${article.text.replace(/\n/g, '<br>')}
                    </div>
                </div>
            `;
            
            overlay.classList.add('show');
            drawer.classList.add('open');
        }

        function closeDrawer() {
            const overlay = document.querySelector('.drawer-overlay');
            const drawer = document.querySelector('.side-drawer');
            overlay.classList.remove('show');
            drawer.classList.remove('open');
        }

        async function processArticle(url, topic) {
            const button = event.target;
            const originalText = button.textContent;
            
            button.disabled = true;
            button.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i>Processing...';
            
            try {
                const response = await fetch('/process_selected', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: url, topic: topic })
                });
                
                const result = await response.json();
                
                if (response.ok && result.posts) {
                    button.classList.remove('btn-outline-primary');
                    button.classList.add('btn-success');
                    button.innerHTML = '<i class="fas fa-check me-1"></i>Processed!';
                    
                    // Show success message
                    showAlert(`Article processed successfully! Generated post with topic "${topic}".`, 'success');
                    
                    // Redirect to content page after a short delay
                    setTimeout(() => {
                        window.location.href = '/content';
                    }, 2000);
                } else {
                    throw new Error(result.error || 'Processing failed');
                }
            } catch (error) {
                console.error('Error processing article:', error);
                button.disabled = false;
                button.textContent = originalText;
                showAlert(`Error processing article: ${error.message}`, 'danger');
            }
        }

        function refreshArticles() {
            document.getElementById('articles-container').innerHTML = `
                <div class="loading-spinner">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Refreshing articles...</span>
                    </div>
                    <p class="mt-2">Refreshing scraped articles...</p>
                </div>
            `;
            loadArticles();
        }

        function filterBySource(source) {
            if (source === 'all') {
                filteredData = [...articlesData];
            } else {
                filteredData = articlesData.filter(article => article.source_domain === source);
            }
            renderArticles();
        }

        function getTimeAgo(dateString) {
            if (!dateString) return 'Unknown';
            
            const date = new Date(dateString);
            const now = new Date();
            const diffInSeconds = Math.floor((now - date) / 1000);
            
            if (diffInSeconds < 60) return 'Just now';
            if (diffInSeconds < 3600) return `${Math.floor(diffInSeconds / 60)} min ago`;
            if (diffInSeconds < 86400) return `${Math.floor(diffInSeconds / 3600)} hr ago`;
            if (diffInSeconds < 2592000) return `${Math.floor(diffInSeconds / 86400)} days ago`;
            
            return date.toLocaleDateString();
        }

        function showAlert(message, type) {
            const alertHtml = `
                <div class="alert alert-${type} alert-dismissible fade show position-fixed" 
                     style="top: 20px; right: 20px; z-index: 9999; min-width: 300px;" role="alert">
                    ${message}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            `;
            
            // Remove existing alerts
            document.querySelectorAll('.alert.position-fixed').forEach(alert => alert.remove());
            
            // Add new alert
            document.body.insertAdjacentHTML('beforeend', alertHtml);
            
            // Auto-remove after 5 seconds
            setTimeout(() => {
                const alert = document.querySelector('.alert.position-fixed');
                if (alert) alert.remove();
            }, 5000);
        }
    </script>
</body>
</html>
